gui:
  scrollHeight: 3
  expandFocusedSidePanel: true
  theme:
    inactiveBorderColor:
      - blue
  authorColors:
    # use green for nikolas
    "NikoKS": "#a3be8c"
    "nikolasetiawan": "#a3be8c"
    # use blue for other authors
    "*": "#81a1c1"
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
os:
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editInTerminal: false
quitOnTopLevelReturn: true
promptToReturnFromSubprocess: false
notARepository: "skip"
keybinding:
  universal:
    gotoTop: "g"
    gotoBottom: "G"
    goInto: "<space>"
    select: "<enter>"
  commits:
    checkoutCommit: "<enter>"
    viewResetOptions: "r"
    renameCommit: ""
  stash:
    popStash: "p"
customCommands:
  - key: "o"
    context: "commitFiles"
    command: "nvim --server $NVIM --remote-send '<C-\\><C-n>:close<CR>'; nvim --server $NVIM --remote-send ':Gshow {{.SelectedCommit.Hash}} {{.SelectedCommitFilePath}}<CR>'"
    description: "open file on this commit"
    output: none
  - key: "o"
    context: "localBranches"
    command: "nvim --server $NVIM --remote-send '<C-\\><C-n>:close<CR>'; nvim --server $NVIM --remote-send ':Gshow {{.SelectedLocalBranch.Name}}<CR>'"
    description: "open current file on this branch"
    output: none
